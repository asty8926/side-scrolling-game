name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    name: Script check + GUT tests (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Godot version
        run: ~/godot/godot --version

      - name: Import project
        # Registers class_name types and imports assets. Exit code is 0 even on script errors,
        # which is why the next step exists.
        run: ~/godot/godot --headless --path . --import

      - name: Check every script parses (strict typing, warnings as errors)
        run: ~/godot/godot --headless --path . -s res://tools/check_scripts.gd

      - name: Run GUT tests
        run: |
          mkdir -p reports
          ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://test -ginclude_subdirs -gexit \
            -gjunit_xml_file=res://reports/gut-junit.xml
          # GUT can exit 0 when it fails to start; require a report with at least one test.
          test -f reports/gut-junit.xml || { echo "GUT wrote no JUnit report"; exit 1; }
          grep -Eq '<testsuites[^>]* tests="[1-9][0-9]*"' reports/gut-junit.xml \
            || { echo "GUT report contains no tests"; exit 1; }

      - name: Upload GUT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-junit
          path: reports/gut-junit.xml
          if-no-files-found: warn
